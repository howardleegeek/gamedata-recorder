[package]
name = "validation-tests"
version = "0.1.0"
edition = "2024"
publish = false

# Stream BN (rc17.2): Cross-platform shim around
# `src/record/validation.rs` so the post-session lint v3 self-validation
# hook can be unit-tested on the dev host (macOS / Linux) without pulling
# the Windows-only top-level deps (libobs-wrapper / glfw / tray-icon /
# egui_overlay). Mirrors the `action-camera-tests` crate pattern.
#
# `validation.rs` references `crate::ui::notification::post_session_toast`
# for the toast call on FAIL. To compile that reference on macOS, this
# crate exposes a local `ui::notification` shim module at the crate root
# whose `post_session_toast` is a no-op tracing log. The real Windows
# toast lives in the parent crate's `src/ui/notification.rs` and is NOT
# tested here — that's a manual smoke test on a Windows host.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
