[package]
name = "engine-telemetry"
version = "0.1.0"
edition = "2024"
description = "Per-title engine telemetry sidecar (RTTI / matrix readback) for ground-truth gameplay data"

# ───────────────────────────────────────────────────────────────────────────
# What this crate is — and what it is NOT.
#
# This is the **engine-state sidecar** companion to `crates/depth-hook`.
# Where `depth-hook` reverse-engineers GPU state (DX12 depth + projection),
# this crate reverse-engineers CPU-side engine state — the player position,
# the camera Follow Offset, the metric scale used to convert engine units
# into meters — by reading the target process's RTTI / object table at the
# start of each rendered frame.
#
# Per docs/CAPTURE_PERFORMANCE_INVESTIGATION.md the encoder pipeline already
# runs at a steady 30 fps; the only missing axis is engine telemetry. With
# (depth, camera matrices, player transform, metric_scale) all aligned per
# frame the recording becomes ground-truth 3D — the moat over the commodity
# raw-video farms — without retraining anything.
#
# Platform scope:
#   - Real RTTI walking is Windows-only (windows-rs + ReadProcessMemory or
#     in-process RED4ext / CET adapters). All of that lives behind
#     `#[cfg(windows)]` in the future `rtti::` module.
#   - On macOS / Linux this crate is **pure Rust** so the developer box
#     and CI can `cargo test` it. The `CyberpunkHook` placeholder
#     compiles everywhere and emits deterministic mock frames so the
#     telemetry plumbing (sidecar writer, JSON contract, frame queue)
#     is unit-testable independently of the actual hook.
#
# Cross-platform crate similar to `crates/action-camera-tests`. No Win32
# deps. Source-includes via `#[path]` are intentionally NOT used yet —
# the puffydev hand-off keeps this crate hermetic so the Windows engineer
# only has to add a single `[target.'cfg(windows)'.dependencies]` block
# (commented as a TODO below) without touching the cross-platform surface.
# ───────────────────────────────────────────────────────────────────────────

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Windows-only dependencies shared by BOTH per-title engine hooks:
#   - Cyberpunk 2077 RED4ext / RTTI walker (`src/cyberpunk_windows.rs`)
#   - GTA V ScriptHookV bridge          (`src/gtav_windows.rs`)
# On Mac/Linux this block is inert and the crate stays pure-Rust so
# `cargo test --target aarch64-apple-darwin` does not need any system
# libraries.
#
# - `libloading` is the cross-platform dynamic-link wrapper. Both hooks
#   use it to `LoadLibrary` their respective third-party DLL —
#   `red4ext.dll` for Cyberpunk, `ScriptHookV.dll` for GTA V — and
#   resolve exported C symbols by name (e.g. `nativeInit`,
#   `nativePush64`, `nativeCall`, `getGlobalPtr`, … for ScriptHookV).
#   We intentionally do NOT static-link to either SDK: the user
#   installs them themselves as third-party plugin loaders, so the
#   build must not assume they exist at link time. Missing-DLL is a
#   runtime fallback (logged + skip-frame), not a build failure. See
#   the failure-mode tables on the respective `*_windows` module docs.
# - `windows` pulls from the workspace declaration so the
#   `windows-sys` transitive stays at one version across the tree. Both
#   hooks ride on the workspace feature set — no new feature flags
#   needed since `libloading` does its own internal `LoadLibraryW` /
#   `GetProcAddress` calls. If a future revision of either hook ever
#   needs `Win32_System_Diagnostics_Debug` (`ReadProcessMemory`) or
#   `Win32_Graphics_Direct3D12` (swap-chain present sync) those go
#   here, but the spec explicitly forbids OOP RPM and the present hook
#   lives in `crates/depth-hook` instead. The Present-wrapper
#   integration likewise piggybacks on `depth-hook`'s frame counter
#   through the recorder; this crate never calls DXGI directly.
[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"
windows = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
