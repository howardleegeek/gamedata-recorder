name: Coverage

# Runs `cargo llvm-cov` across the workspace's testable crates and uploads
# the lcov report to Codecov. Per the PRD R10.3 target of >=80% line
# coverage on `crates/*`, this job is the gate for merging changes that
# regress coverage.
#
# Why two jobs:
#   - `coverage-mac`: runs on macos because three of the workspace crates
#     (engine-telemetry, depth-hook, constants) are cross-platform pure
#     Rust and serve as the primary CI for the plumbing tests. Fast and
#     uses default rustup toolchain.
#   - `coverage-windows`: runs on windows because the input-capture and
#     game-process crates depend on `windows` unconditionally and cannot
#     compile on macOS. This job covers the Win32-only logic (raw-input
#     pipeline, foreground gate, process enumeration).
#
# Both jobs upload to Codecov with distinct flags so the dashboard can
# show per-platform breakdowns. The merge gate enforces >=80% on the
# combined report.

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  # ---------------------------------------------------------------
  # Cross-platform crates: engine-telemetry, depth-hook, constants
  # ---------------------------------------------------------------
  coverage-mac:
    name: Coverage (cross-platform crates)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
          target: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-mac

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The workspace root crate depends on `windows` unconditionally
      # so we cannot run `cargo llvm-cov --workspace` on macOS. Scope
      # the coverage run to the three cross-platform crates only.
      - name: Generate lcov report (cross-platform crates)
        run: |
          cargo llvm-cov \
            --target aarch64-apple-darwin \
            -p engine-telemetry \
            -p depth-hook \
            -p constants \
            --lcov \
            --output-path lcov.mac.info

      - name: Print coverage summary
        run: |
          cargo llvm-cov report \
            --target aarch64-apple-darwin \
            --summary-only

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.mac.info
          flags: cross-platform
          name: macos-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-mac
          path: lcov.mac.info
          retention-days: 30

  # ---------------------------------------------------------------
  # Windows-only crates: input-capture, game-process
  # plus the cross-platform crates re-measured against MSVC.
  # ---------------------------------------------------------------
  coverage-windows:
    name: Coverage (Windows-only crates)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
          target: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-windows

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # input-capture and game-process compile only on Windows. We run
      # coverage on them here. The cross-platform crates also build on
      # Windows so they're included in this report too. The full root
      # crate (gamedata-recorder) needs OBS prerequisites that the
      # GitHub runner lacks, so we coverage just the workspace
      # sub-crates by enumerating them.
      - name: Generate lcov report (workspace sub-crates)
        run: |
          cargo llvm-cov `
            -p constants `
            -p depth-hook `
            -p engine-telemetry `
            -p input-capture `
            -p game-process `
            --lcov `
            --output-path lcov.windows.info
        shell: pwsh

      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only
        shell: pwsh

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./lcov.windows.info
          flags: windows
          name: windows-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-windows
          path: lcov.windows.info
          retention-days: 30
